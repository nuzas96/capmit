<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060" role="img" aria-labelledby="title desc"><title id="title">The cost hidden in an open calendar</title><desc id="desc">Causes → late discovery of overload → consequences. Documentation of Capmit ideation, not empirical findings.</desc><rect width="1000" height="1060" fill="#FAFBF7"/><g font-family="Arial, sans-serif"><text x="48" y="46" font-size="18" font-weight="600" fill="#2859B8"><tspan x="48" dy="0">Capmit / Ideation</tspan></text><text x="48" y="95" font-size="36" font-weight="700" fill="#23352D"><tspan x="48" dy="0">The cost hidden in an open calendar</tspan></text><text x="48" y="130" font-size="19" font-weight="400" fill="#23352D"><tspan x="48" dy="0">Causes → late discovery of overload → consequences</tspan></text><text x="48" y="190" font-size="24" font-weight="700" fill="#23352D"><tspan x="48" dy="0">Contributing causes</tspan></text><path d="M58 215 Q190.0 213 322 216 Q332 215 332 225 L331 291 Q332 301 322 301 L58 300 Q48 301 49 291 L48 225 Q48 215 58 215" fill="none" stroke="#D6DDD7" stroke-width="2"/><text x="64" y="247" font-size="21" font-weight="400" fill="#23352D"><tspan x="64" dy="0">Time mistaken for total</tspan><tspan x="64" dy="28.35">capacity</tspan></text><path d="M368 215 Q500.0 213 632 216 Q642 215 642 225 L641 291 Q642 301 632 301 L368 300 Q358 301 359 291 L358 225 Q358 215 368 215" fill="none" stroke="#D6DDD7" stroke-width="2"/><text x="374" y="247" font-size="21" font-weight="400" fill="#23352D"><tspan x="374" dy="0">Commitments evaluated</tspan><tspan x="374" dy="28.35">in isolation</tspan></text><path d="M678 215 Q810.0 213 942 216 Q952 215 952 225 L951 291 Q952 301 942 301 L678 300 Q668 301 669 291 L668 225 Q668 215 678 215" fill="none" stroke="#D6DDD7" stroke-width="2"/><text x="684" y="247" font-size="21" font-weight="400" fill="#23352D"><tspan x="684" dy="0">Different commitments</tspan><tspan x="684" dy="28.35">have different costs</tspan></text><path d="M58 323 Q190.0 321 322 324 Q332 323 332 333 L331 399 Q332 409 322 409 L58 408 Q48 409 49 399 L48 333 Q48 323 58 323" fill="none" stroke="#D6DDD7" stroke-width="2"/><text x="64" y="355" font-size="21" font-weight="400" fill="#23352D"><tspan x="64" dy="0">Recovery is easy to</tspan><tspan x="64" dy="28.35">sacrifice</tspan></text><path d="M368 323 Q500.0 321 632 324 Q642 323 642 333 L641 399 Q642 409 632 409 L368 408 Q358 409 359 399 L358 333 Q358 323 368 323" fill="none" stroke="#D6DDD7" stroke-width="2"/><text x="374" y="355" font-size="21" font-weight="400" fill="#23352D"><tspan x="374" dy="0">Existing planning is</tspan><tspan x="374" dy="28.35">often reactive</tspan></text><path d="M678 323 Q810.0 321 942 324 Q952 323 952 333 L951 399 Q952 409 942 409 L678 408 Q668 409 669 399 L668 333 Q668 323 678 323" fill="none" stroke="#D6DDD7" stroke-width="2"/><text x="684" y="355" font-size="21" font-weight="400" fill="#23352D"><tspan x="684" dy="0">High-input planners</tspan><tspan x="684" dy="28.35">create friction</tspan></text><path d="M190 415 Q187 433.0 190 451 m-7 -9 l7 9 l7 -9" fill="none" stroke="#2859B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M500 415 Q497 433.0 500 451 m-7 -9 l7 9 l7 -9" fill="none" stroke="#2859B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M810 415 Q807 433.0 810 451 m-7 -9 l7 9 l7 -9" fill="none" stroke="#2859B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M49 466 Q500 457 950 466 L949 570 Q505 577 49 570 Z" fill="#F2DE73"/><text x="72" y="496" font-size="26" font-weight="700" fill="#23352D"><tspan x="72" dy="0">University students often discover overload only after they have</tspan><tspan x="72" dy="35.1">already accepted too many commitments.</tspan></text><path d="M190 584 Q187 603.0 190 622 m-7 -9 l7 9 l7 -9" fill="none" stroke="#2859B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M500 584 Q497 603.0 500 622 m-7 -9 l7 9 l7 -9" fill="none" stroke="#2859B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M810 584 Q807 603.0 810 622 m-7 -9 l7 9 l7 -9" fill="none" stroke="#2859B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="658" font-size="24" font-weight="700" fill="#23352D"><tspan x="48" dy="0">Possible effects</tspan></text><path d="M58 680 Q190.0 678 322 681 Q332 680 332 690 L331 764 Q332 774 322 774 L58 773 Q48 774 49 764 L48 690 Q48 680 58 680" fill="none" stroke="#D6DDD7" stroke-width="2"/><text x="64" y="711" font-size="20" font-weight="400" fill="#23352D"><tspan x="64" dy="0">Overloaded days / weeks</tspan></text><path d="M368 680 Q500.0 678 632 681 Q642 680 642 690 L641 764 Q642 774 632 774 L368 773 Q358 774 359 764 L358 690 Q358 680 368 680" fill="none" stroke="#D6DDD7" stroke-width="2"/><text x="374" y="711" font-size="20" font-weight="400" fill="#23352D"><tspan x="374" dy="0">Deadline competition</tspan></text><path d="M678 680 Q810.0 678 942 681 Q952 680 952 690 L951 764 Q952 774 942 774 L678 773 Q668 774 669 764 L668 690 Q668 680 678 680" fill="none" stroke="#D6DDD7" stroke-width="2"/><text x="684" y="711" font-size="20" font-weight="400" fill="#23352D"><tspan x="684" dy="0">Last-minute rescheduling</tspan></text><path d="M58 786 Q190.0 784 322 787 Q332 786 332 796 L331 870 Q332 880 322 880 L58 879 Q48 880 49 870 L48 796 Q48 786 58 786" fill="none" stroke="#D6DDD7" stroke-width="2"/><text x="64" y="817" font-size="20" font-weight="400" fill="#23352D"><tspan x="64" dy="0">Recovery squeezed out</tspan></text><path d="M368 786 Q500.0 784 632 787 Q642 786 642 796 L641 870 Q642 880 632 880 L368 879 Q358 880 359 870 L358 796 Q358 786 368 786" fill="none" stroke="#D6DDD7" stroke-width="2"/><text x="374" y="817" font-size="20" font-weight="400" fill="#23352D"><tspan x="374" dy="0">Overwhelm</tspan></text><path d="M678 786 Q810.0 784 942 787 Q952 786 952 796 L951 870 Q952 880 942 880 L678 879 Q668 880 669 870 L668 796 Q668 786 678 786" fill="none" stroke="#D6DDD7" stroke-width="2"/><text x="684" y="817" font-size="20" font-weight="400" fill="#23352D"><tspan x="684" dy="0">Difficulty deciding what</tspan><tspan x="684" dy="27.0">to move, split, defer or</tspan><tspan x="684" dy="27.0">decline</tspan></text><text x="48" y="926" font-size="20" font-weight="700" fill="#2859B8"><tspan x="48" dy="0">Design opportunity</tspan></text><text x="48" y="965" font-size="25" font-weight="700" fill="#23352D"><tspan x="48" dy="0">Make the hidden cost of saying yes visible before acceptance.</tspan></text><path d="M48 1012 Q440 1010 952 1013" stroke="#D6DDD7" fill="none"/><text x="48" y="1037" font-size="16" font-weight="400" fill="#23352D"><tspan x="48" dy="0">CodeNection 2026  /  Concept rationale, not interview or research results</tspan></text></g></svg>