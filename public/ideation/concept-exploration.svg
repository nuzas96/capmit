<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1130" viewBox="0 0 1000 1130" role="img" aria-labelledby="title desc"><title id="title">Eight ideas. One focused mechanism.</title><desc id="desc">Breadth of exploration → explicit selection and scope decisions. Documentation of Capmit ideation, not empirical findings.</desc><rect width="1000" height="1130" fill="#FAFBF7"/><g font-family="Arial, sans-serif"><text x="48" y="46" font-size="18" font-weight="600" fill="#2859B8"><tspan x="48" dy="0">Capmit / Ideation</tspan></text><text x="48" y="95" font-size="36" font-weight="700" fill="#23352D"><tspan x="48" dy="0">Eight ideas. One focused mechanism.</tspan></text><text x="48" y="130" font-size="19" font-weight="400" fill="#23352D"><tspan x="48" dy="0">Breadth of exploration → explicit selection and scope decisions</tspan></text><text x="48" y="190" font-size="25" font-weight="700" fill="#2859B8"><tspan x="48" dy="0">Chosen</tspan></text><path d="M48 199 Q90 195 151 199" stroke="#F2DE73" stroke-width="7"/><text x="64" y="221" font-size="23" font-weight="700" fill="#23352D"><tspan x="64" dy="0">Commitment Simulator</tspan></text><text x="64" y="252" font-size="20" font-weight="400" fill="#23352D"><tspan x="64" dy="0">Primary hero: preview the cost before acceptance.</tspan></text><text x="64" y="312" font-size="23" font-weight="700" fill="#23352D"><tspan x="64" dy="0">Explainable Trade-off Scenarios</tspan></text><text x="64" y="343" font-size="20" font-weight="400" fill="#23352D"><tspan x="64" dy="0">Secondary hero: actionable choices with reasons.</tspan></text><text x="48" y="407" font-size="25" font-weight="700" fill="#2859B8"><tspan x="48" dy="0">Supporting</tspan></text><text x="64" y="438" font-size="23" font-weight="700" fill="#23352D"><tspan x="64" dy="0">Weekly Capacity Dashboard</tspan></text><text x="64" y="469" font-size="20" font-weight="400" fill="#23352D"><tspan x="64" dy="0">Awareness helps, but does not resolve the decision alone.</tspan></text><text x="64" y="529" font-size="23" font-weight="700" fill="#23352D"><tspan x="64" dy="0">Recovery Coach</tspan></text><text x="64" y="560" font-size="20" font-weight="400" fill="#23352D"><tspan x="64" dy="0">Protect recovery as a supporting constraint.</tspan></text><text x="48" y="624" font-size="25" font-weight="700" fill="#2859B8"><tspan x="48" dy="0">Dropped</tspan></text><text x="64" y="655" font-size="23" font-weight="700" fill="#23352D"><tspan x="64" dy="0">Stress Journal + Trend Tracker</tspan></text><text x="64" y="686" font-size="20" font-weight="400" fill="#23352D"><tspan x="64" dy="0">Too passive without active decision support.</tspan></text><text x="64" y="746" font-size="23" font-weight="700" fill="#23352D"><tspan x="64" dy="0">Automatic AI Scheduler</tspan></text><text x="64" y="777" font-size="20" font-weight="400" fill="#23352D"><tspan x="64" dy="0">Overlap with existing automatic scheduling workflows.</tspan></text><text x="64" y="837" font-size="23" font-weight="700" fill="#23352D"><tspan x="64" dy="0">AI Chat Planner</tspan></text><text x="64" y="868" font-size="20" font-weight="400" fill="#23352D"><tspan x="64" dy="0">An interface; recommendations may remain opaque.</tspan></text><text x="64" y="928" font-size="23" font-weight="700" fill="#23352D"><tspan x="64" dy="0">Social Accountability / Peer Sharing</tspan></text><text x="64" y="959" font-size="20" font-weight="400" fill="#23352D"><tspan x="64" dy="0">Privacy, moderation and social complexity exceed scope.</tspan></text><path d="M48 1082 Q440 1080 952 1083" stroke="#D6DDD7" fill="none"/><text x="48" y="1107" font-size="16" font-weight="400" fill="#23352D"><tspan x="48" dy="0">CodeNection 2026  /  Concept rationale, not interview or research results</tspan></text></g></svg>