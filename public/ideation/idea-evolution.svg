<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1030" viewBox="0 0 1000 1030" role="img" aria-labelledby="title desc"><title id="title">From tracking to a decision before yes</title><desc id="desc">V1 awareness → capacity → simulation → reasons → protected recovery. Documentation of Capmit ideation, not empirical findings.</desc><rect width="1000" height="1030" fill="#FAFBF7"/><g font-family="Arial, sans-serif"><text x="48" y="46" font-size="18" font-weight="600" fill="#2859B8"><tspan x="48" dy="0">Capmit / Ideation</tspan></text><text x="48" y="95" font-size="36" font-weight="700" fill="#23352D"><tspan x="48" dy="0">From tracking to a decision before yes</tspan></text><text x="48" y="130" font-size="19" font-weight="400" fill="#23352D"><tspan x="48" dy="0">V1 awareness → capacity → simulation → reasons → protected recovery</tspan></text><text x="48" y="210" font-size="21" font-weight="700" fill="#2859B8"><tspan x="48" dy="0">Stage 1</tspan></text><path d="M180 180 Q561.0 178 942 181 Q952 180 952 190 L951 264 Q952 274 942 274 L180 273 Q170 274 171 264 L170 190 Q170 180 180 180" fill="none" stroke="#D6DDD7" stroke-width="2"/><text x="190" y="214" font-size="25" font-weight="700" fill="#23352D"><tspan x="190" dy="0">Stress Tracker / Workload Visualizer</tspan></text><text x="190" y="247" font-size="20" font-weight="400" fill="#23352D"><tspan x="190" dy="0">Too passive</tspan></text><path d="M530 278 Q527 288.0 530 298 m-7 -9 l7 9 l7 -9" fill="none" stroke="#2859B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="333" font-size="21" font-weight="700" fill="#2859B8"><tspan x="48" dy="0">Stage 2</tspan></text><path d="M180 303 Q561.0 301 942 304 Q952 303 952 313 L951 387 Q952 397 942 397 L180 396 Q170 397 171 387 L170 313 Q170 303 180 303" fill="none" stroke="#D6DDD7" stroke-width="2"/><text x="190" y="337" font-size="25" font-weight="700" fill="#23352D"><tspan x="190" dy="0">Multidimensional Load Balancing</tspan></text><text x="190" y="370" font-size="20" font-weight="400" fill="#23352D"><tspan x="190" dy="0">Better problem fit, but overlaps with reactive schedulers</tspan></text><path d="M530 401 Q527 411.0 530 421 m-7 -9 l7 9 l7 -9" fill="none" stroke="#2859B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="456" font-size="21" font-weight="700" fill="#2859B8"><tspan x="48" dy="0">Stage 3</tspan></text><path d="M180 426 Q561.0 424 942 427 Q952 426 952 436 L951 510 Q952 520 942 520 L180 519 Q170 520 171 510 L170 436 Q170 426 180 426" fill="none" stroke="#D6DDD7" stroke-width="2"/><text x="190" y="460" font-size="25" font-weight="700" fill="#23352D"><tspan x="190" dy="0">Pre-Commitment Simulation</tspan></text><text x="190" y="493" font-size="20" font-weight="400" fill="#23352D"><tspan x="190" dy="0">Move decision BEFORE saying yes</tspan></text><path d="M530 524 Q527 534.0 530 544 m-7 -9 l7 9 l7 -9" fill="none" stroke="#2859B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="579" font-size="21" font-weight="700" fill="#2859B8"><tspan x="48" dy="0">Stage 4</tspan></text><path d="M180 549 Q561.0 547 942 550 Q952 549 952 559 L951 633 Q952 643 942 643 L180 642 Q170 643 171 633 L170 559 Q170 549 180 549" fill="none" stroke="#D6DDD7" stroke-width="2"/><text x="190" y="583" font-size="25" font-weight="700" fill="#23352D"><tspan x="190" dy="0">Explainable Trade-Off Scenarios</tspan></text><text x="190" y="616" font-size="20" font-weight="400" fill="#23352D"><tspan x="190" dy="0">Avoid opaque automatic scheduling</tspan></text><path d="M530 647 Q527 657.0 530 667 m-7 -9 l7 9 l7 -9" fill="none" stroke="#2859B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="702" font-size="21" font-weight="700" fill="#2859B8"><tspan x="48" dy="0">Stage 5</tspan></text><path d="M180 672 Q561.0 670 942 673 Q952 672 952 682 L951 756 Q952 766 942 766 L180 765 Q170 766 171 756 L170 682 Q170 672 180 672" fill="none" stroke="#D6DDD7" stroke-width="2"/><text x="190" y="706" font-size="25" font-weight="700" fill="#23352D"><tspan x="190" dy="0">Recovery Floor</tspan></text><text x="190" y="739" font-size="20" font-weight="400" fill="#23352D"><tspan x="190" dy="0">Protect recovery as a constraint</tspan></text><text x="48" y="842" font-size="24" font-weight="700" fill="#2859B8"><tspan x="48" dy="0">The central pivot</tspan></text><text x="48" y="885" font-size="24" font-weight="400" fill="#23352D"><tspan x="48" dy="0">From: “How do we rearrange the week after overload?”</tspan></text><path d="M48 916 Q510 911 947 917 L947 962 L48 960 Z" fill="#F2DE73"/><text x="62" y="945" font-size="28" font-weight="700" fill="#23352D"><tspan x="62" dy="0">To: “If I accept this, what has to give?”</tspan></text><path d="M48 982 Q440 980 952 983" stroke="#D6DDD7" fill="none"/><text x="48" y="1007" font-size="16" font-weight="400" fill="#23352D"><tspan x="48" dy="0">CodeNection 2026  /  Concept rationale, not interview or research results</tspan></text></g></svg>