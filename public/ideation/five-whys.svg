<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050" role="img" aria-labelledby="title desc"><title id="title">Why does overload arrive as a surprise?</title><desc id="desc">Five linked questions that move the intervention earlier. Documentation of Capmit ideation, not empirical findings.</desc><rect width="1000" height="1050" fill="#FAFBF7"/><g font-family="Arial, sans-serif"><text x="48" y="46" font-size="18" font-weight="600" fill="#2859B8"><tspan x="48" dy="0">Capmit / Ideation</tspan></text><text x="48" y="95" font-size="36" font-weight="700" fill="#23352D"><tspan x="48" dy="0">Why does overload arrive as a surprise?</tspan></text><text x="48" y="130" font-size="19" font-weight="400" fill="#23352D"><tspan x="48" dy="0">Five linked questions that move the intervention earlier</tspan></text><text x="48" y="195" font-size="23" font-weight="700" fill="#23352D"><tspan x="48" dy="0">Problem: Students realise too late that they have taken on too much.</tspan></text><text x="50" y="267" font-size="22" font-weight="700" fill="#2859B8"><tspan x="50" dy="0">Why 1</tspan></text><path d="M170 235 Q555.0 233 940 236 Q950 235 950 245 L949 316 Q950 326 940 326 L170 325 Q160 326 161 316 L160 245 Q160 235 170 235" fill="none" stroke="#D6DDD7" stroke-width="2"/><text x="180" y="270" font-size="23" font-weight="400" fill="#23352D"><tspan x="180" dy="0">Multiple commitments collide during the week.</tspan></text><path d="M530 331 Q527 341.5 530 352 m-7 -9 l7 9 l7 -9" fill="none" stroke="#2859B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="389" font-size="22" font-weight="700" fill="#2859B8"><tspan x="50" dy="0">Why 2</tspan></text><path d="M170 357 Q555.0 355 940 358 Q950 357 950 367 L949 438 Q950 448 940 448 L170 447 Q160 448 161 438 L160 367 Q160 357 170 357" fill="none" stroke="#D6DDD7" stroke-width="2"/><text x="180" y="392" font-size="23" font-weight="400" fill="#23352D"><tspan x="180" dy="0">Commitments were assessed individually.</tspan></text><path d="M530 453 Q527 463.5 530 474 m-7 -9 l7 9 l7 -9" fill="none" stroke="#2859B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="511" font-size="22" font-weight="700" fill="#2859B8"><tspan x="50" dy="0">Why 3</tspan></text><path d="M170 479 Q555.0 477 940 480 Q950 479 950 489 L949 560 Q950 570 940 570 L170 569 Q160 570 161 560 L160 489 Q160 479 170 479" fill="none" stroke="#D6DDD7" stroke-width="2"/><text x="180" y="514" font-size="23" font-weight="400" fill="#23352D"><tspan x="180" dy="0">Calendar availability was treated as the main signal.</tspan></text><path d="M530 575 Q527 585.5 530 596 m-7 -9 l7 9 l7 -9" fill="none" stroke="#2859B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="633" font-size="22" font-weight="700" fill="#2859B8"><tspan x="50" dy="0">Why 4</tspan></text><path d="M170 601 Q555.0 599 940 602 Q950 601 950 611 L949 682 Q950 692 940 692 L170 691 Q160 692 161 682 L160 611 Q160 601 170 601" fill="none" stroke="#D6DDD7" stroke-width="2"/><text x="180" y="636" font-size="23" font-weight="400" fill="#23352D"><tspan x="180" dy="0">Free time does not represent mental, physical, social,</tspan><tspan x="180" dy="31.05">errand, and recovery capacity.</tspan></text><path d="M530 697 Q527 707.5 530 718 m-7 -9 l7 9 l7 -9" fill="none" stroke="#2859B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="755" font-size="22" font-weight="700" fill="#2859B8"><tspan x="50" dy="0">Why 5</tspan></text><path d="M170 723 Q555.0 721 940 724 Q950 723 950 733 L949 804 Q950 814 940 814 L170 813 Q160 814 161 804 L160 733 Q160 723 170 723" fill="none" stroke="#D6DDD7" stroke-width="2"/><text x="180" y="758" font-size="23" font-weight="400" fill="#23352D"><tspan x="180" dy="0">Planning often happens after a commitment already exists.</tspan></text><rect x="48" y="875" width="904" height="109" rx="3" fill="#F2DE73"/><text x="66" y="907" font-size="19" font-weight="700" fill="#2859B8"><tspan x="66" dy="0">Root opportunity</tspan></text><text x="66" y="945" font-size="25" font-weight="700" fill="#23352D"><tspan x="66" dy="0">Turn ‘Should I say yes?’ into a visible what-if decision instead</tspan><tspan x="66" dy="33.75">of a guess.</tspan></text><path d="M48 1002 Q440 1000 952 1003" stroke="#D6DDD7" fill="none"/><text x="48" y="1027" font-size="16" font-weight="400" fill="#23352D"><tspan x="48" dy="0">CodeNection 2026  /  Concept rationale, not interview or research results</tspan></text></g></svg>